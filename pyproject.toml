[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tcmb-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for Central Bank of Türkiye (TCMB) exchange rates"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
tcmb-mcp = "tcmb_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tcmb_mcp"]
